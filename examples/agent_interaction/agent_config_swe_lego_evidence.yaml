- name: swe_agent

  _target_: examples.agent_interaction.swe_lego_evidence_agent_loop.SWELegoEvidenceAgentLoop

  concurrency: 2
  log_dir: /workspace/output/swebench_eval/swe_lego_qwen3_8b_trajectories
  mask_abnormal_exit_traj: false
  tool_parser: hermes

  interaction:
    action_timeout: 300
    timeout_budget: 3
    max_turns: 12

  env:
    post_setup_cmd: python -m pip install -q --no-index --find-links=/opt/swe-rex-wheels tree-sitter==0.21.3 tree-sitter-languages==1.10.2
    deployment:
      type: local
      container_runtime: docker
      command: /opt/miniconda3/bin/python3.11 -m pip install -q --no-index --find-links=/opt/swe-rex-wheels swe-rex==1.4.0 && /opt/miniconda3/bin/python3.11 -m swerex.server --host 0.0.0.0 --port {port} --auth-token {token}
      timeout: 600
      startup_timeout: 600
      runtime_port: 8000
      network: bridge
      extra_run_args:
        - -v
        - /data1/zpy/workspace/output/swebench_eval/swe_rex_wheels_py311:/opt/swe-rex-wheels:ro
    env_variables:
      PIP_PROGRESS_BAR: "off"
      PIP_CACHE_DIR: "~/.cache/pip"
      PAGER: "cat"
      MANPAGER: "cat"
      LESS: "-R"
      TQDM_DISABLE: "1"
      GIT_PAGER: "cat"

  tools:
    - name: str_replace_editor
    - name: execute_bash
    - name: submit

  reward:
    name: swe_bench_evidence
    eval_timeout: 600
